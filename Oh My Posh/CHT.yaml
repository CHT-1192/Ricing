$schema: "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version: 4
final_space: true


palette:

  dark_blue: "#0080FF" 
  mid_blue: "#00A0FF"
  light_blue: "#00FFFF"
  white: "#FFFFFF"
  red: "#FF0000"
  text: "#101020"   # Use you terminal's background color


blocks:

  - type: prompt
    alignment: left
    segments:

      - type: os
        style: diamond
        leading_diamond: "\ue0b6"
        background: "p:dark_blue"
        foreground: "p:white"
        template: " {{ .Icon }} "

      - type: session
        style: powerline
        powerline_symbol: "\ue0b0"
        background: "p:mid_blue"
        foreground: "p:text"
        template: " {{ if .Env.PRIVACY_PROTECTED_USERNAME }}{{ .Env.PRIVACY_PROTECTED_USERNAME }}{{ else }}{{ .UserName }}{{ end }} "

      - type: path
        style: powerline
        powerline_symbol: "\ue0b0"
        background: "p:light_blue"
        foreground: "p:text"
        template: " {{ .Path }} "
        options:
          style: agnoster_short
          max_depth: 2
          folder_icon: "..."

      - type: text
        style: diamond
        trailing_diamond: "\ue0b0"
        background: "p:white"
        foreground: "p:text"
        foreground_templates:
          - "{{ if .Root }}p:red{{ end }}"
        template: " {{ if .Root }}#{{ else }}${{ end }} "

  - type: rprompt
    segments:

      - type: executiontime
        style: plain
        foreground: "p:white"
        template: "{{ if .Executed }}{{ if gt .Code 0 }}<#FF0000>{{ .Code }}</> {{ end }}{{ .FormattedMs }} | {{ end }}"
        options:
          always_enabled: true

      - type: git
        style: plain
        foreground: "p:white"
        template: "{{ .HEAD }}{{ if and .ShortHash (not .Detached) }} {{ .ShortHash }}{{ end }}{{ if or (gt .Ahead 0) (gt .Behind 0) }} {{ .BranchStatus }}{{ end }} | "
        options:
          branch_icon: "\ue702 "

      - type: time
        style: plain
        foreground: "p:white"
        template: "{{ .CurrentDate | date .Format }}"
        options:
          time_format: "21:09"
